kind = "web"
previewPath = "/"
title = "CORCA Website"
description = "Sitio estático bilingüe en HTML, CSS y JavaScript estándar, servido por Node.js sin frameworks ni dependencias de producción."
version = "1.0.0"
id = "artifacts/corca-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23517

[services.development]
run = "node server.mjs"

[services.production]
build = [ "node", "scripts/check-static.mjs" ]
run = [ "node", "server.mjs" ]

[services.env]
PORT = "23517"
BASE_PATH = "/"
